# Beispiel, nicht in kustomization.yaml: Geheimnisse für /v1/sign. Mit
# echten Werten nie ins Repository, sondern über einen Secret-Manager
# anlegen. Die PKCS#12-Datei als eigenes Secret einhängen und in der
# Konfiguration "signer": "pkcs12:/etc/pdx-signer/schluessel.p12" setzen.
apiVersion: v1
kind: Secret
metadata:
  name: pdx-signer
  namespace: pdx
type: Opaque
stringData:
  PDX_SIGN_PASSWORD: ERSETZEN
  # PDX_SIGN_TOKEN: ERSETZEN
