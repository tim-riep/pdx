# Example, not in kustomization.yaml: secrets for /v1/sign. Never commit
# real values to the repository, create them through a secret manager
# instead. Mount the PKCS#12 file as a separate Secret and set
# "signer": "pkcs12:/etc/pdx-signer/schluessel.p12" in the configuration.
apiVersion: v1
kind: Secret
metadata:
  name: pdx-signer
  namespace: pdx
type: Opaque
stringData:
  PDX_SIGN_PASSWORD: ERSETZEN
  # PDX_SIGN_TOKEN: ERSETZEN
