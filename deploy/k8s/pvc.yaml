# Shared template store of all instances. Needs a StorageClass with
# ReadWriteMany (such as NFS or CephFS). Versions are created exclusively,
# active is replaced atomically, so multiple instances write safely.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdx-templates
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
