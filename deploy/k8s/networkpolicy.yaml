# Ingress only from pods with the label pdx-client=true (any namespace)
# and from monitoring, egress only DNS. For /v1/sign from B-T on, also
# allow the timestamp service, and for B-LT also OCSP and CRL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pdx-server
spec:
  podSelector:
    matchLabels:
      app: pdx-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              pdx-client: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
