# Engine und Designer bauen und testen. Der Designer wird auf allen drei
# Systemen nativ gebaut und kurz gestartet (Smoke-Test). Die Ende-zu-Ende-Tests
# laufen gegen den Server-Build in Chromium und WebKit.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test ./...

  # Das Frontend muss mit Node 22 und 24 bauen und bestehen (engines in
  # designer/frontend/package.json). Die Designer-Jobs nutzen Node 24.
  frontend:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: designer/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npx vite build
      - run: npx vitest run --passWithNoTests
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

  designer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: designer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache-dependency-path: designer/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Linux-Pakete für GTK4 und WebKitGTK 6.0
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - run: npm ci --ignore-scripts
        working-directory: designer/frontend
      - name: Bindungen aktuell
        run: |
          make bindings
          git diff --exit-code frontend/bindings
      - run: make check
      - name: Drittanbieterhinweise aktuell
        if: runner.os == 'Linux'
        run: make notices-check
      - run: make test
      - name: Natives Binary und Smoke-Test
        run: |
          make build
          ./smoke.sh
      - name: Paket und Installation nach der Konvention pro Benutzer
        run: |
          make package
          packaging/test-install.sh
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.4.3 -y --no-progress }
      - name: Setup-Programm bauen und testen
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            make installer ISCC="C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          else
            make installer
          fi
          packaging/test-installer.sh
      - name: Playwright-Browser
        run: npx playwright install --with-deps chromium webkit
        working-directory: designer/frontend
      - run: make e2e
      - name: Berichte der Ende-zu-Ende-Tests bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: designer/frontend/test-results
          retention-days: 7
