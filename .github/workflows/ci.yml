# Build and test the engine and the designer. The designer is built natively
# on all three systems and started briefly (smoke test). The end-to-end tests
# run against the server build in Chromium and WebKit.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test ./...

  # The frontend must build and pass with Node 22 and 24 (engines in
  # designer/frontend/package.json). The designer jobs use Node 24.
  frontend:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: designer/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npx vite build
      - run: npx vitest run --passWithNoTests
      - run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

  designer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: designer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache-dependency-path: designer/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Linux packages for GTK4 and WebKitGTK 6.0
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - run: npm ci --ignore-scripts
        working-directory: designer/frontend
      - name: Bindings up to date
        run: |
          make bindings
          git diff --exit-code frontend/bindings
      - run: make check
      - name: Third-party notices up to date
        if: runner.os == 'Linux'
        run: make notices-check
      - run: make test
      - name: Native binary and smoke test
        run: |
          make build
          ./smoke.sh
      - name: Package and per-user installation
        run: |
          make package
          packaging/test-install.sh
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.4.3 -y --no-progress }
      - name: Build and test the installer
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            make installer ISCC="C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          else
            make installer
          fi
          packaging/test-installer.sh
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: designer/frontend
      - run: make e2e
      - name: End-to-end test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: designer/frontend/test-results
          retention-days: 7
