# Release bei einem Tag v*: Engine prüfen, pdx und pdx-server für alle
# Systeme bauen, den Designer nativ auf macOS, Linux und Windows, das Image
# von pdx-server nach ghcr.io und alles als GitHub-Release mit Prüfsummen.
# Die Release-Notizen kommen aus der Nachricht des annotierten Tags.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tag passt zur Version im Code
        run: |
          want="v$(sed -n 's/^const Version = "\(.*\)"/\1/p' pdx.go)"
          designer="v$(sed -n 's/^const Version = "\(.*\)"/\1/p' designer/internal/app/app.go)"
          if [ "$GITHUB_REF_NAME" != "$want" ] || [ "$GITHUB_REF_NAME" != "$designer" ]; then
            echo "Tag $GITHUB_REF_NAME, Engine $want, Designer $designer" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test ./...

  cli:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: pdx und pdx-server für alle Systeme
        run: |
          set -eu
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="pdx-${GITHUB_REF_NAME}-${os}-${arch}"
            mkdir -p "build/$name"
            for cmd in pdx pdx-server; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -buildid=" \
                -o "build/$name/$cmd$ext" "./cmd/$cmd"
            done
            cp LICENSE NOTICE THIRD_PARTY_NOTICES.txt README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qrX "../dist/$name.zip" "$name")
            else
              tar -C build --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
                -czf "dist/$name.tar.gz" "$name"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*

  designer:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          - os: macos-15
            name: darwin-arm64
          - os: windows-2025
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: designer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: designer/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Linux-Pakete für GTK4 und WebKitGTK 6.0
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - run: npm ci --ignore-scripts
        working-directory: designer/frontend
      - name: Bauen und Smoke-Test
        run: |
          make build
          ./smoke.sh
      - name: Archiv
        run: |
          set -eu
          EXT=""; [ "$RUNNER_OS" = "Windows" ] && EXT=".exe"
          name="pdx-designer-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "../build/$name" ../dist
          cp "../out/pdx-designer$EXT" "../build/$name/"
          cp ../LICENSE ../NOTICE README.md "../build/$name/"
          cp notices/THIRD_PARTY_NOTICES.txt "../build/$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd ../build && 7z a -tzip -bso0 "../dist/$name.zip" "$name")
          else
            tar -C ../build -czf "../dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: designer-${{ matrix.name }}
          path: dist/*

  image:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image reproduzierbar bauen und veröffentlichen
        run: |
          set -eu
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/pdx-server"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg SOURCE_DATE_EPOCH --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --output "type=image,name=${repo}:${GITHUB_REF_NAME},push=true,rewrite-timestamp=true" \
            --metadata-file meta.json -f deploy/Dockerfile .
          digest=$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' meta.json)
          echo "${repo}:${GITHUB_REF_NAME}@${digest}" > image.txt
          cat image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.txt

  release:
    needs: [cli, designer, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd artifacts
          image=$(cat image.txt)
          rm image.txt
          sha256sum * > SHA256SUMS
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d' > ../notes.md
          printf '\n## Container\n\n```\ndocker pull %s\n```\n' "$image" >> ../notes.md
          gh release create "$GITHUB_REF_NAME" --title "pdx ${GITHUB_REF_NAME}" --notes-file ../notes.md *
