# Release on a v* tag: check the engine, build pdx and pdx-server for all
# systems, build the designer natively on macOS, Linux and Windows, push the
# pdx-server image to ghcr.io and publish everything as a GitHub release with
# checksums. The release notes come from the message of the annotated tag.
# macOS files are signed with Developer ID and notarized, Windows files with
# the Certum Open Source Code Signing certificate (SimplySign cloud, ssign
# derives the one-time code from the secret CERTUM_OTP).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tag matches the version in the code
        run: |
          want="v$(sed -n 's/^const Version = "\(.*\)"/\1/p' pdx.go)"
          designer="v$(sed -n 's/^const Version = "\(.*\)"/\1/p' designer/internal/app/app.go)"
          if [ "$GITHUB_REF_NAME" != "$want" ] || [ "$GITHUB_REF_NAME" != "$designer" ]; then
            echo "Tag $GITHUB_REF_NAME, Engine $want, Designer $designer" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: CGO_ENABLED=0 go test ./...

  cli:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # ssign signs through Certum's SimplySign cloud
      # (https://github.com/Le-Syl21/ssign), pinned version, built once and cached.
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/ssign*
          key: ssign-0.1.8-${{ runner.os }}-${{ runner.arch }}
      - name: ssign
        run: |
          set -eu
          bin="$HOME/.cargo/bin/ssign"
          [ -x "$bin" ] || [ -x "$bin.exe" ] || cargo install ssign --version 0.1.8 --locked
          if command -v cygpath >/dev/null; then bin=$(cygpath -m "$bin.exe"); fi
          "$bin" --version
          echo "SSIGN=$bin" >> "$GITHUB_ENV"
      - name: osslsigncode
        run: sudo apt-get update && sudo apt-get install -y osslsigncode
      - name: pdx and pdx-server for Linux and Windows, Windows signed
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          set -eu
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="pdx-${GITHUB_REF_NAME}-${os}-${arch}"
            mkdir -p "build/$name"
            for cmd in pdx pdx-server; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -buildid=" \
                -o "build/$name/$cmd$ext" "./cmd/$cmd"
            done
            [ "$os" != windows ] || designer/packaging/windows/sign.sh pdx "build/$name"/*.exe
            cp LICENSE NOTICE THIRD_PARTY_NOTICES.txt README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qrX "../dist/$name.zip" "$name")
            else
              tar -C build --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
                -czf "dist/$name.tar.gz" "$name"
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: dist/*

  # macOS binaries are built on macOS, signed with Developer ID and
  # notarized (packaging/macos).
  cli-darwin:
    needs: check
    runs-on: macos-15
    env:
      MACOS_REQUIRE_NOTARIZATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: designer/packaging/macos/ci-keychain.sh
      - name: pdx and pdx-server for macOS, signed and notarized
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          mkdir -p dist
          for arch in arm64 amd64; do
            name="pdx-${GITHUB_REF_NAME}-darwin-${arch}"
            mkdir -p "build/$name"
            for cmd in pdx pdx-server; do
              CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags="-s -w -buildid=" \
                -o "build/$name/$cmd" "./cmd/$cmd"
            done
            designer/packaging/macos/sign-bin.sh "build/$name/pdx" "build/$name/pdx-server"
            cp LICENSE NOTICE THIRD_PARTY_NOTICES.txt README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
      - name: Remove keychain
        if: always()
        run: if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-darwin
          path: dist/*

  designer:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          - os: macos-15
            name: darwin-arm64
          - os: windows-2025
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: designer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: designer/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Linux packages for GTK4 and WebKitGTK 6.0
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - run: npm ci --ignore-scripts
        working-directory: designer/frontend
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.4.3 -y --no-progress }
      # ssign signs through Certum's SimplySign cloud
      # (https://github.com/Le-Syl21/ssign), pinned version, built once and cached.
      - if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/ssign*
          key: ssign-0.1.8-${{ runner.os }}-${{ runner.arch }}
      - name: ssign
        if: runner.os == 'Windows'
        run: |
          set -eu
          bin="$HOME/.cargo/bin/ssign"
          [ -x "$bin" ] || [ -x "$bin.exe" ] || cargo install ssign --version 0.1.8 --locked
          if command -v cygpath >/dev/null; then bin=$(cygpath -m "$bin.exe"); fi
          "$bin" --version
          echo "SSIGN=$bin" >> "$GITHUB_ENV"
      - name: Set up signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: packaging/macos/ci-keychain.sh
      # make installer builds the package and the installer in one run, on
      # macOS with a signed, notarized app and a signed .pkg, on Windows with
      # a signed pdx-designer.exe, setup and uninstaller.
      - name: Build, smoke test, package, installer and installation tests
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          MACOS_REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && '1' || '' }}
        run: |
          make build
          ./smoke.sh
          if [ "$RUNNER_OS" = "Windows" ]; then
            make installer ISCC="C:/Program Files (x86)/Inno Setup 6/ISCC.exe"
          else
            make installer
          fi
          packaging/test-install.sh
          packaging/test-installer.sh
      - name: Remove keychain
        if: always() && runner.os == 'macOS'
        run: if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN"; fi
      - name: Archive
        run: |
          set -eu
          name="pdx-designer-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p ../dist
          mv ../out/package/pdx-designer "../out/package/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd ../out/package && 7z a -tzip -bso0 "../../dist/$name.zip" "$name")
          else
            tar -C ../out/package -czf "../dist/$name.tar.gz" "$name"
          fi
          cp ../out/installer/* ../dist/
      - uses: actions/upload-artifact@v7
        with:
          name: designer-${{ matrix.name }}
          path: dist/*

  image:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the image reproducibly
        run: |
          set -eu
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/pdx-server"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg SOURCE_DATE_EPOCH --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --output "type=image,name=${repo}:${GITHUB_REF_NAME},push=true,rewrite-timestamp=true" \
            --metadata-file meta.json -f deploy/Dockerfile .
          digest=$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' meta.json)
          echo "${repo}:${GITHUB_REF_NAME}@${digest}" > image.txt
          cat image.txt
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.txt

  release:
    needs: [cli, cli-darwin, designer, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd artifacts
          image=$(cat image.txt)
          rm image.txt
          sha256sum * > SHA256SUMS
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d' > ../notes.md
          printf '\n## Container\n\n```\ndocker pull %s\n```\n' "$image" >> ../notes.md
          gh release create "$GITHUB_REF_NAME" --title "pdx ${GITHUB_REF_NAME}" --notes-file ../notes.md *
