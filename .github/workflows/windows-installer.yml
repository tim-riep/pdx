# Rebuild the Windows setup of a draft release from the signed Designer.
# The setup embeds pdx-designer.exe, so it can only be built after that file
# is signed. scripts/sign-windows.sh signs the executables in the Windows
# archives of the draft, uploads them and starts this workflow. It downloads
# the signed archive, refuses an unsigned executable, builds the setup with
# Inno Setup, runs the installation test and replaces the setup in the draft.
# The script then signs the new setup itself.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release, e.g. v0.4.0
        required: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  setup:
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: designer
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Valid tag of a draft release
        working-directory: .
        run: |
          set -eu
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid tag: $TAG" >&2; exit 1; }
          draft=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$draft" = true ] || { echo "$TAG is not a draft release" >&2; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --version=6.4.3 -y --no-progress }
      - name: Signed Designer from the draft
        run: |
          set -eu
          name="pdx-designer-${TAG}-windows-amd64"
          mkdir -p ../out/dl ../out/package
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name.zip" -D ../out/dl
          7z x -bso0 -o../out/dl ../out/dl/$name.zip
          mv "../out/dl/$name" ../out/package/pdx-designer
      - name: Executable carries a valid signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature ..\out\package\pdx-designer\pdx-designer.exe
          if ($sig.Status -ne 'Valid') { Write-Error "pdx-designer.exe is not signed: $($sig.Status) $($sig.StatusMessage)"; exit 1 }
      - name: Setup and installation test
        run: |
          set -eu
          mkdir -p ../out/installer
          "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q -DVersion="${TAG#v}" -DTag="$TAG" -DOut=../../../out/installer packaging/windows/pdx-designer.iss
          packaging/test-installer.sh
      - name: Replace the setup in the draft
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ../out/installer/pdx-designer-${TAG}-windows-amd64-setup.exe
