# Manual check of the macOS signing secrets without publishing anything:
# load the certificates, find both identities, and sign in to the notary
# service with the API key.
#   gh workflow run signing-check.yml
name: Signing check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Load certificates
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: designer/packaging/macos/ci-keychain.sh
      - name: Identities
        run: |
          # Only the certificate type, no names or team IDs.
          security find-identity -v "$MACOS_KEYCHAIN" | sed -n 's/.*"\(Developer ID [A-Za-z]*\): .*/\1 gefunden/p'
          security find-identity -v "$MACOS_KEYCHAIN" | tail -1
      - name: Sign in to the notary service
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if ! printf '%s' "$NOTARY_ISSUER_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::NOTARY_ISSUER_ID ist keine UUID (Issuer ID über der Schlüsseltabelle in App Store Connect)"
            exit 1
          fi
          xcrun notarytool history --key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" | head -5
          echo "Anmeldung beim Notardienst erfolgreich"
      - name: Remove keychain
        if: always()
        run: if [ -n "${MACOS_KEYCHAIN:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN"; fi
